<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.15)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.7)" />
    </linearGradient>
    <linearGradient id="emeraldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.15)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.7)" />
    </linearGradient>
    <linearGradient id="violetCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.15)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.7)" />
    </linearGradient>
    <linearGradient id="amberCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.15)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.7)" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="820" fill="url(#bgGradient)" />

  <!-- Grid Dots Background Pattern -->
  <g opacity="0.12" fill="#38bdf8">
    <circle cx="50" cy="50" r="1.5"/><circle cx="150" cy="50" r="1.5"/><circle cx="250" cy="50" r="1.5"/><circle cx="350" cy="50" r="1.5"/><circle cx="450" cy="50" r="1.5"/><circle cx="550" cy="50" r="1.5"/><circle cx="650" cy="50" r="1.5"/><circle cx="750" cy="50" r="1.5"/><circle cx="850" cy="50" r="1.5"/><circle cx="950" cy="50" r="1.5"/><circle cx="1050" cy="50" r="1.5"/><circle cx="1150" cy="50" r="1.5"/>
    <circle cx="50" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/><circle cx="250" cy="150" r="1.5"/><circle cx="350" cy="150" r="1.5"/><circle cx="450" cy="150" r="1.5"/><circle cx="550" cy="150" r="1.5"/><circle cx="650" cy="150" r="1.5"/><circle cx="750" cy="150" r="1.5"/><circle cx="850" cy="150" r="1.5"/><circle cx="950" cy="150" r="1.5"/><circle cx="1050" cy="150" r="1.5"/><circle cx="1150" cy="150" r="1.5"/>
    <circle cx="50" cy="750" r="1.5"/><circle cx="150" cy="750" r="1.5"/><circle cx="250" cy="750" r="1.5"/><circle cx="350" cy="750" r="1.5"/><circle cx="450" cy="750" r="1.5"/><circle cx="550" cy="750" r="1.5"/><circle cx="650" cy="750" r="1.5"/><circle cx="750" cy="750" r="1.5"/><circle cx="850" cy="750" r="1.5"/><circle cx="950" cy="750" r="1.5"/><circle cx="1050" cy="750" r="1.5"/><circle cx="1150" cy="750" r="1.5"/>
  </g>

  <!-- Title Header -->
  <text x="600" y="48" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="0.5">
    Interactive Knowledge Base — Grounded Intelligence &amp; Graph Architecture
  </text>
  <text x="600" y="74" text-anchor="middle" fill="#94a3b8" font-size="13">
    High-Throughput Ingestion (500+ Docs) • Dual-Database Persistence • Hybrid RRF &amp; Graph Traversal • Cross-Lingual Hindi Routing
  </text>

  <!-- ========================================================================= -->
  <!-- TOP LAYER: CLIENT & GATEWAY -->
  <!-- ========================================================================= -->
  <g id="top-layer">
    <!-- Split Screen UI Box -->
    <rect x="180" y="110" width="380" height="95" rx="12" fill="url(#cyanCard)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="200" y="136" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">CLIENT INTERFACE</text>
    <text x="200" y="160" fill="#ffffff" font-size="16" font-weight="600">Split-Screen Interactive React UI</text>
    <text x="200" y="182" fill="#cbd5e1" font-size="12">Force-directed canvas graph • Topic picker • Real-time citation inspector</text>

    <!-- REST API Gateway Box -->
    <rect x="640" y="110" width="380" height="95" rx="12" fill="url(#violetCard)" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="660" y="136" fill="#c084fc" font-size="11" font-weight="700" letter-spacing="1">API GATEWAY &amp; RUNNER</text>
    <text x="660" y="160" fill="#ffffff" font-size="16" font-weight="600">FastAPI Person 4 Service &amp; Gates</text>
    <text x="660" y="182" fill="#cbd5e1" font-size="12">HTTP 202 Mutation receipts • Sub-second polling • Gate 0-3 test contracts</text>
  </g>

  <!-- Top Connection Arrows -->
  <path d="M 560 157 L 640 157" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <path d="M 640 167 L 560 167" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-violet)" />

  <!-- ========================================================================= -->
  <!-- COLUMN 1: PHASE 2 INGESTION PIPELINE -->
  <!-- ========================================================================= -->
  <g id="ingestion-column">
    <rect x="60" y="240" width="320" height="420" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect x="75" y="255" width="290" height="32" rx="6" fill="rgba(6, 182, 212, 0.15)" />
    <text x="220" y="276" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">PHASE 2: INGESTION &amp; EXTRACTION</text>

    <!-- Step 1: Parser -->
    <rect x="80" y="305" width="280" height="65" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="96" y="328" fill="#38bdf8" font-size="13" font-weight="600">1. Unstructured Parser</text>
    <text x="96" y="348" fill="#94a3b8" font-size="11">PDF (PyPDF) &amp; TXT normalization • Content hash</text>

    <!-- Step 2: Chunker -->
    <rect x="80" y="390" width="280" height="65" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="96" y="413" fill="#38bdf8" font-size="13" font-weight="600">2. Deterministic 600-Token Chunker</text>
    <text x="96" y="433" fill="#94a3b8" font-size="11">tiktoken cl100k_base • Strict 600-800 bounds</text>

    <!-- Step 3: Extractor -->
    <rect x="80" y="475" width="280" height="75" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="96" y="498" fill="#38bdf8" font-size="13" font-weight="600">3. Entity &amp; Relation Extraction</text>
    <text x="96" y="518" fill="#94a3b8" font-size="11">Concept/Entity nodes • Exact quotes • Modality</text>
    <text x="96" y="534" fill="#64748b" font-size="10">Neutralizes 20+ planted prompt injections</text>

    <!-- Step 4: Embeddings -->
    <rect x="80" y="570" width="280" height="65" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="96" y="593" fill="#38bdf8" font-size="13" font-weight="600">4. Multilingual Embedder</text>
    <text x="96" y="613" fill="#94a3b8" font-size="11">768-Dim paraphrase-multilingual-mpnet-base</text>

    <!-- Flow Arrows Column 1 -->
    <path d="M 220 370 L 220 390" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" />
    <path d="M 220 455 L 220 475" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" />
    <path d="M 220 550 L 220 570" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" />
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: DUAL-DATABASE STORAGE & PERSISTENCE TIER -->
  <!-- ========================================================================= -->
  <g id="storage-column">
    <rect x="440" y="240" width="320" height="420" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect x="455" y="255" width="290" height="32" rx="6" fill="rgba(16, 185, 129, 0.15)" />
    <text x="600" y="276" text-anchor="middle" fill="#34d399" font-size="12" font-weight="700">DUAL-DATABASE PERSISTENCE TIER</text>

    <!-- DB 1: ChromaDB -->
    <rect x="460" y="305" width="280" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="482" cy="328" r="5" fill="#10b981" filter="url(#glow)" />
    <text x="496" y="333" fill="#34d399" font-size="14" font-weight="700">Chroma Vector Database</text>
    <text x="496" y="354" fill="#cbd5e1" font-size="11">Persistent on-disk storage: <tspan fill="#34d399" font-family="monospace">./data/chroma</tspan></text>
    <text x="496" y="372" fill="#94a3b8" font-size="11">HNSW cosine metric index • Workspace collections</text>
    <text x="496" y="388" fill="#64748b" font-size="10">Active &amp; connected persistent client</text>

    <!-- DB 2: Neo4j & Embedded Graph -->
    <rect x="460" y="420" width="280" height="115" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="482" cy="443" r="5" fill="#06b6d4" filter="url(#glow)" />
    <text x="496" y="448" fill="#38bdf8" font-size="14" font-weight="700">Knowledge Graph Engine</text>
    <text x="496" y="469" fill="#cbd5e1" font-size="11">Neo4j AuraDB &amp; Bolt adapter</text>
    <text x="496" y="487" fill="#94a3b8" font-size="11">Embedded transactional graph fallback</text>
    <text x="496" y="505" fill="#94a3b8" font-size="11">Multi-doc entity refs • Revision isolation</text>
    <text x="496" y="522" fill="#38bdf8" font-size="10">Sub-millisecond retrieval &amp; subgraph slices</text>

    <!-- DB 3: Atomic Operations Store -->
    <rect x="460" y="555" width="280" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="482" cy="578" r="5" fill="#f59e0b" filter="url(#glow)" />
    <text x="496" y="583" fill="#fbbf24" font-size="14" font-weight="700">Durable Operations Store</text>
    <text x="496" y="604" fill="#cbd5e1" font-size="11">Directory: <tspan fill="#fbbf24" font-family="monospace">./data/operations</tspan></text>
    <text x="496" y="622" fill="#94a3b8" font-size="11">Atomic disk checkpoints • Crash recovery</text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: PHASE 3 THEMATIC & GROUNDED REASONING -->
  <!-- ========================================================================= -->
  <g id="reasoning-column">
    <rect x="820" y="240" width="320" height="420" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect x="835" y="255" width="290" height="32" rx="6" fill="rgba(139, 92, 246, 0.15)" />
    <text x="980" y="276" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="700">PHASE 3: RETRIEVAL &amp; REASONING</text>

    <!-- Reasoning 1: HDBSCAN Topics -->
    <rect x="840" y="305" width="280" height="65" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="856" y="328" fill="#c084fc" font-size="13" font-weight="600">Thematic Topic Clustering</text>
    <text x="856" y="348" fill="#94a3b8" font-size="11">HDBSCAN discovery + incremental centroids</text>

    <!-- Reasoning 2: Hybrid RRF & Graph -->
    <rect x="840" y="390" width="280" height="65" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="856" y="413" fill="#c084fc" font-size="13" font-weight="600">Hybrid RRF Fusion &amp; Traversal</text>
    <text x="856" y="433" fill="#94a3b8" font-size="11">BM25 + Dense cosine + Multi-hop graph walk</text>

    <!-- Reasoning 3: O(N) Conflict Detection -->
    <rect x="840" y="475" width="280" height="65" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" />
    <text x="856" y="498" fill="#f87171" font-size="13" font-weight="600">O(N) Contradiction Detection</text>
    <text x="856" y="518" fill="#94a3b8" font-size="11">Hash-bucket polarity/target conflicts (&lt;2ms)</text>

    <!-- Reasoning 4: Cross-Lingual Hindi -->
    <rect x="840" y="560" width="280" height="75" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="856" y="583" fill="#c084fc" font-size="13" font-weight="600">Cross-Lingual Hindi Engine</text>
    <text x="856" y="603" fill="#94a3b8" font-size="11">Answers Hindi queries over English corpus</text>
    <text x="856" y="619" fill="#64748b" font-size="10">Shows supporting graph traversal path</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CROSS-LAYER CONNECTORS -->
  <!-- ========================================================================= -->
  <!-- Ingestion to Storage -->
  <path d="M 360 512 L 460 480" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <text x="410" y="488" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">Publish KG</text>

  <path d="M 360 600 L 460 360" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <text x="405" y="435" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">Upsert</text>

  <!-- Storage to Reasoning -->
  <path d="M 740 350 L 840 415" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <text x="790" y="375" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">Dense ANN</text>

  <path d="M 740 475 L 840 435" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <text x="790" y="465" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">Graph Walk</text>

  <!-- Reasoning to Gateway / Response -->
  <path d="M 980 240 L 980 205" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-violet)" />
  <text x="990" y="222" fill="#c084fc" font-size="10" font-weight="600">Grounded Synthesis</text>

  <!-- Ingestion from Gateway -->
  <path d="M 280 205 L 280 240" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <text x="290" y="222" fill="#38bdf8" font-size="10" font-weight="600">Uploads</text>

  <!-- ========================================================================= -->
  <!-- FOOTER / STATS BAR -->
  <!-- ========================================================================= -->
  <rect x="60" y="695" width="1080" height="80" rx="10" fill="#0f172a" stroke="#1e293b" />
  
  <g transform="translate(100, 725)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-weight="600">MUTATION LATENCY</text>
    <text x="0" y="24" fill="#10b981" font-size="18" font-weight="700">&lt; 100 ms (Single Doc)</text>
    <text x="0" y="40" fill="#94a3b8" font-size="11">60s requirement exceeded</text>
  </g>

  <g transform="translate(420, 725)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-weight="600">BULK CAPACITY</text>
    <text x="0" y="24" fill="#06b6d4" font-size="18" font-weight="700">500+ Documents</text>
    <text x="0" y="40" fill="#94a3b8" font-size="11">Zip bundle &amp; parallel workers</text>
  </g>

  <g transform="translate(720, 725)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-weight="600">PERSISTENCE</text>
    <text x="0" y="24" fill="#38bdf8" font-size="18" font-weight="700">ChromaDB + Neo4j</text>
    <text x="0" y="40" fill="#94a3b8" font-size="11">Disk embeddings &amp; graph fallback</text>
  </g>

  <g transform="translate(980, 725)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-weight="600">TEST SUITE</text>
    <text x="0" y="24" fill="#a855f7" font-size="18" font-weight="700">120 / 120 Passed</text>
    <text x="0" y="40" fill="#94a3b8" font-size="11">All 4 phases verified</text>
  </g>
</svg>
